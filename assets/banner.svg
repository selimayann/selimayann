<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7dcfff;#7aa2f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#7dcfff;#7aa2f7;#bb9af7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .name { font: 800 64px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; }
    .role { font: 500 22px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #c0caf5; }
    .meta { font: 15px ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #7f89b5; }
    .code { font: 14px ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .fade { opacity: 0; animation: in 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.2s } .d2 { animation-delay: 0.6s } .d3 { animation-delay: 1s } .d4 { animation-delay: 1.4s }
    @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px) } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <circle cx="1020" cy="40" r="220" fill="url(#glow2)"/>
    <circle cx="120" cy="250" r="220" fill="url(#glow1)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="none" stroke="#7aa2f7" stroke-opacity="0.18"/>

  <g transform="translate(64 0)">
    <text class="meta fade d1" x="0" y="74">// hello, world</text>
    <text class="name fade d2" x="0" y="142" fill="url(#name)">Ayan Selim</text>
    <text class="role fade d3" x="2" y="182">Full-stack Developer · Kotlin · Spring Boot · Flutter</text>
    <text class="meta fade d4" x="2" y="214">CS @ ACS UPB  ·  Bucharest, RO</text>
  </g>

  <g class="fade d4">
    <g class="float" transform-origin="960 130">
      <rect x="790" y="62" width="340" height="140" rx="12" fill="#0b1020" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="812" cy="82" r="5" fill="#f7768e"/><circle cx="830" cy="82" r="5" fill="#e0af68"/><circle cx="848" cy="82" r="5" fill="#9ece6a"/>
      <text class="code" x="812" y="118"><tspan fill="#bb9af7">fun</tspan><tspan fill="#7aa2f7"> main</tspan><tspan fill="#c0caf5">() {</tspan></text>
      <text class="code" x="832" y="142"><tspan fill="#7dcfff">println</tspan><tspan fill="#c0caf5">(</tspan><tspan fill="#9ece6a">"Let's build"</tspan><tspan fill="#c0caf5">)</tspan></text>
      <text class="code" x="812" y="166" fill="#c0caf5">}</text>
      <rect x="830" y="154" width="8" height="16" fill="#7aa2f7"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
