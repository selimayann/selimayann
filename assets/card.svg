<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#26a641"/><stop offset="1" stop-color="#39d353"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 600; fill: #3fb950; }
    .hero { font-size: 72px; font-weight: 700; letter-spacing: -2px; fill: #f5f5f7; }
    .lead { font-size: 26px; font-weight: 500; letter-spacing: -0.3px; fill: #86868b; }
    .lbl { font-size: 15px; font-weight: 500; fill: #86868b; }
    .val { font-size: 26px; font-weight: 600; letter-spacing: -0.4px; fill: #f5f5f7; }
    .sub { font-size: 17px; fill: #a1a1a6; }
    .num { font-size: 44px; font-weight: 700; letter-spacing: -1px; }
    .unit { font-size: 22px; font-weight: 600; fill: #86868b; }
    .link { font-size: 17px; font-weight: 500; fill: #4493f8; }
    .f { opacity: 0; animation: in .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleY(0) } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="649" rx="28" fill="#0d1117" stroke="#30363d"/>

  <g class="f">
    <text class="eyebrow" x="64" y="88">Bucharest, Romania</text>
    <text class="link" x="1136" y="88" text-anchor="end">LinkedIn ›</text>
  </g>
  <text class="hero f" style="animation-delay:.1s" x="60" y="166">Ayan Selim.</text>
  <text class="lead f" style="animation-delay:.2s" x="64" y="210">Full-stack developer. Built with Kotlin, Spring Boot and Flutter.</text>

  <line x1="64" y1="252" x2="1136" y2="252" stroke="#21262d"/>
  <g class="f" style="animation-delay:0.35s">
    <text class="lbl" x="64" y="300">Studying</text>
    <text class="val" x="64" y="336">Computer Science</text>
    <text class="sub" x="64" y="368">ACS UPB · Year 3</text>
  </g>
  <g class="f" style="animation-delay:0.45s">
    <text class="lbl" x="424" y="300">Working at</text>
    <text class="val" x="424" y="336">Animalia</text>
    <text class="sub" x="424" y="368">Full-stack developer</text>
  </g>
  <g class="f" style="animation-delay:0.55s">
    <text class="lbl" x="784" y="300">Stack</text>
    <text class="val" x="784" y="336">Kotlin · Spring Boot</text>
    <text class="sub" x="784" y="368">Flutter · Dart · Java · PostgreSQL</text>
    <text class="sub" x="784" y="394">Python · C · JavaScript · Git</text>
  </g>
  <line x1="64" y1="452" x2="1136" y2="452" stroke="#21262d"/>

  <g class="f" style="animation-delay:.6s">
    <text class="lbl" x="64" y="500">Activity</text>
    <text class="num" x="64" y="566" fill="#f5f5f7">478<tspan class="unit"></tspan></text>
  <text class="lbl" x="64" y="596">contributions</text>
    <text class="num" x="270" y="566" fill="#f5f5f7">9<tspan class="unit"> days</tspan></text>
  <text class="lbl" x="270" y="596">current streak</text>
    <text class="num" x="476" y="566" fill="#f5f5f7">9<tspan class="unit"> days</tspan></text>
  <text class="lbl" x="476" y="596">longest streak</text>
    <text class="lbl" x="700" y="500">Last 26 weeks</text>
  </g>
