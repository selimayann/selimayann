    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8c42"><animate attributeName="stop-color" values="#ff8c42;#ffa25c;#ff8c42" dur="8s" repeatCount="indefinite"/></stop>
