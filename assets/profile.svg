    .chip { font: 16px ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .num { font: 700 42px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .f { opacity: 0; animation: in .7s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .6s ease-out both; }
    @keyframes grow { from { transform: scaleY(0) } }
  </style>
